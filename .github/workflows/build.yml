name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      add_nekplik_to:
        description: "Also put NEKPLIK's files (built from this branch) into this existing release, like v1.6.2"
        required: false
        default: ""

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        run: git ls-files '*.sh' | xargs shellcheck --severity=warning

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > release.jks; fi
      - name: Build
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' && 'release.jks' || 'key.jks' }}
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS || 'tvhome123' }}
        run: sh build.sh
      # NEKPLIK and NEKPLIK Share, with the same key as the home screen (its NEKPLIK library page needs
      # that). Their build scripts change folder, so the key's path is a full one.
      - name: Build NEKPLIK
        env:
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS || 'tvhome123' }}
        run: |
          if [ -f release.jks ]; then KEYSTORE="$PWD/release.jks"; else KEYSTORE="$PWD/key.jks"; fi
          export KEYSTORE
          sh nekplik/build.sh
          sh nekplik/share-android/build.sh
      # NEKPLIK Share for Windows: the launcher, share.py and the browser version's page, in one folder.
      - name: NEKPLIK Share for Windows
        run: |
          d="out/NEKPLIK Share"; mkdir -p "$d/web"
          cp "nekplik/share-app/NEKPLIK Share.bat" nekplik/share.py "$d/"
          cp nekplik/share-android/res/raw/web.html "$d/web/web.html"
          cp nekplik/res/drawable-xhdpi/logo.png "$d/web/logo.png"
          cp nekplik/res/drawable-xxxhdpi/icon.png "$d/web/icon.png"
          (cd out && zip -qr NEKPLIK-Share-Windows.zip "NEKPLIK Share")
      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: out/tvhome.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nekplik-apk
          path: |
            nekplik/out/nekplik.apk
            nekplik/share-android/out/nekplik-share.apk
            out/NEKPLIK-Share-Windows.zip

  # NEKPLIK Share for Mac: an app only a Mac can make (osacompile, sips, iconutil).
  mac-share:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: NEKPLIK Share.app
        run: |
          cd nekplik/share-app
          sh make-mac-app.sh
          ditto -c -k --keepParent "NEKPLIK Share.app" ../../NEKPLIK-Share-Mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mac-share
          path: NEKPLIK-Share-Mac.zip

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [28, 30]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: tvhome-apk
          path: out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Android TV emulator (API ${{ matrix.api }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          script: sh ci/smoke-test.sh emulator-5554 smoke-api${{ matrix.api }}.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-api${{ matrix.api }}
          path: smoke-api*.png

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [shellcheck, build, emulator-test, mac-share]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tvhome-apk
      - uses: actions/download-artifact@v4
        with:
          name: nekplik-apk
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: mac-share
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="tvhome.apk $(find . -name nekplik.apk -o -name nekplik-share.apk -o -name 'NEKPLIK-Share-*.zip' | tr '\n' ' ')"
          # A release made by hand first gets the files added instead.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" $files --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME · Telebisyon and NEKPLIK" \
              --notes "Install with: sh setup.sh <TV_IP>. NEKPLIK alone: sh nekplik/nekplik.sh <TV_IP>"
          fi

  # Run by hand with "add_nekplik_to": NEKPLIK's files into a release that's already out, leaving
  # its home screen as it is.
  add-nekplik:
    if: github.event_name == 'workflow_dispatch' && inputs.add_nekplik_to != ''
    needs: [build, mac-share]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nekplik-apk
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: mac-share
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.add_nekplik_to }}
        run: |
          gh release upload "$TAG" $(find . -name nekplik.apk -o -name nekplik-share.apk -o -name 'NEKPLIK-Share-*.zip') \
            --clobber --repo "$GITHUB_REPOSITORY"
