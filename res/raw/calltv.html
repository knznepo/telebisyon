<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call</title>
<!-- What the TV shows during a call (Call.java), in a WebView over everything. Never opened in a browser. -->
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body.full { background: #000; }
  video { width: 100%; height: 100%; display: block; object-fit: contain; }
  body.corner video { object-fit: cover; border-radius: 24px; }
  /* Audio only: no video, and a badge only while the phone is talking. */
  .badge { display: none; }
  body.audio video { display: none; }
  body.audio .badge { display: flex; align-items: center; justify-content: center; gap: 0.6em; box-sizing: border-box; height: 100%;
    border-radius: 999px; background: rgba(35, 29, 31, .95); border: 2px solid rgba(255, 255, 255, .09);
    color: #fff; font: 500 30vh/1 sans-serif; opacity: 0; transition: opacity .3s; }
  body.audio.talking .badge { opacity: 1; }
  .dot { width: 0.6em; height: 0.6em; border-radius: 50%; background: #d93025; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<audio id="a" autoplay muted></audio>
<div class="badge"><span class="dot"></span>Phone</div>
<script>
  var q = "?t=" + new URLSearchParams(location.search).get("t"), v = document.getElementById("v");
  function post(path, body) {
    return fetch("/call/tv/" + path + q, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  }

  // The sound goes through Web Audio, not the video: a playing video takes Android's audio focus,
  // which pauses what's on the TV. Web Audio mixes the voice over it instead. (Chrome only plays a
  // call's sound in Web Audio while a media element holds it too, hence the muted <audio>.)
  var Ctx = window.AudioContext || window.webkitAudioContext, ctx = new Ctx(), level = ctx.createAnalyser();
  level.fftSize = 512;
  function hear(track) {
    var s = new MediaStream([track]);
    document.getElementById("a").srcObject = s;
    var src = ctx.createMediaStreamSource(s);
    src.connect(level);
    // Louder than what's on: doubled, through a limiter so a loud voice doesn't crackle.
    var boost = ctx.createGain(), limit = ctx.createDynamicsCompressor();
    boost.gain.value = 2.5;
    limit.threshold.value = -12;
    limit.knee.value = 6;
    limit.ratio.value = 12;
    limit.attack.value = 0.003;
    limit.release.value = 0.25;
    src.connect(boost);
    boost.connect(limit);
    limit.connect(ctx.destination);
    ctx.resume().then(function () { console.log("call: sound playing, " + ctx.state); });
  }

  var pc = new RTCPeerConnection(), lost = null, connected = false;
  pc.ontrack = function (e) {
    console.log("call: got " + e.track.kind);
    if (e.track.kind === "audio") hear(e.track);
    else { v.srcObject = new MediaStream([e.track]); v.play().catch(function () {}); }
  };
  // The phone's video shape, so a corner window fits it (it changes when the phone turns).
  v.addEventListener("resize", function () { if (v.videoWidth) post("size", { w: v.videoWidth, h: v.videoHeight }); });
  // The phone went away (closed, out of Wi-Fi): end the call after a few seconds of nothing.
  pc.oniceconnectionstatechange = function () {
    var st = pc.iceConnectionState;
    console.log("call: " + st);
    clearTimeout(lost);
    if (st === "connected" || st === "completed") connected = true;
    if (st === "failed" || st === "closed") post("end");
    else if (st === "disconnected") lost = setTimeout(function () { post("end"); }, 5000);
  };
  setTimeout(function () { if (!connected) post("end"); }, 30000);

  // Is someone talking? The badge shows while they are, and goes after a moment of quiet. The phone
  // hears about it too, so it can say the TV is getting its sound.
  var samples = new Float32Array(level.fftSize), lastTalk = 0, told = 0, logged = 0, wasTalking = false;
  setInterval(function () {
    level.getFloatTimeDomainData(samples);
    var sum = 0;
    for (var i = 0; i < samples.length; i++) sum += samples[i] * samples[i];
    var now = Date.now(), loud = Math.sqrt(sum / samples.length) > 0.015;
    if (loud) lastTalk = now;
    var talking = now - lastTalk < 1500;
    document.body.classList.toggle("talking", talking);
    // While someone talks, the TV turns down what's playing (Call.duck), and back up after.
    if (talking !== wasTalking) {
      wasTalking = talking;
      if (window.Telebisyon) Telebisyon.talking(talking);
    }
    if (now - told > 2000) { told = now; post("heard", { sound: now - lastTalk < 4000, playing: ctx.state === "running" }); }
    if (now - logged > 5000) {
      logged = now;
      pc.getStats().then(function (r) {
        r.forEach(function (x) {
          if (x.type === "inbound-rtp" && x.kind === "audio")
            console.log("call: sound in " + x.bytesReceived + " bytes, level " + (x.audioLevel || 0).toFixed(3) + ", heard " + Math.sqrt(sum / samples.length).toFixed(3));
        });
      });
    }
  }, 100);

  fetch("/call/tv/offer" + q).then(function (r) { return r.json(); }).then(function (o) {
    document.body.className = o.video ? o.size : "audio";
    return pc.setRemoteDescription({ type: "offer", sdp: o.sdp });
  }).then(function () { return pc.createAnswer(); })
    .then(function (a) { return pc.setLocalDescription(a); })
    .then(function () {
      return new Promise(function (done) {
        if (pc.iceGatheringState === "complete") return done();
        var t = setTimeout(done, 3000);
        pc.addEventListener("icegatheringstatechange", function () {
          if (pc.iceGatheringState === "complete") { clearTimeout(t); done(); }
        });
      });
    })
    .then(function () { return post("answer", { sdp: pc.localDescription.sdp }); })
    .catch(function (e) { console.log("call: " + e); post("end"); });
</script>
</body>
</html>
