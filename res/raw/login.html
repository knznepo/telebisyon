<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161113">
<title>Telebisyon</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; padding: 16px;
    background: radial-gradient(circle 900px at 10% -10%, #5b2a3a, transparent), radial-gradient(circle 800px at 100% 110%, #23365a, transparent), #161113; }
  .panel { width: 100%; max-width: 380px; text-align: center; }
  h1 { font-size: 30px; margin: 0 0 6px; }
  .lede { margin: 0 auto 22px; }
  input { text-align: center; font-size: 24px !important; letter-spacing: .3em; }
  .btn { width: 100%; margin-top: 14px; }
  .err { color: #ff8a80; min-height: 1.45em; margin: 12px 0 0; font-size: 15px; }
</style>
</head>
<body>
<!-- Shown in place of any page while the TV has a PIN and this browser hasn't signed in (Messages.signedIn). -->
<form class="panel" id="f">
  <h1>Telebisyon</h1>
  <p class="lede">Enter the TV's PIN to use these pages.</p>
  <input type="password" id="pin" inputmode="numeric" autocomplete="current-password" aria-label="PIN" autofocus required>
  <button class="btn primary" type="submit">Sign in</button>
  <p class="err" id="err" role="alert"></p>
</form>
<script>
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var err = document.getElementById("err"), pin = document.getElementById("pin");
    err.textContent = "";
    fetch("/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin: pin.value }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (r) {
        if (r.ok) location.reload();
        else { err.textContent = r.j.error || "That didn't work"; pin.value = ""; pin.focus(); }
      })
      .catch(function () { err.textContent = "Couldn't reach the TV"; });
  });
</script>
</body>
</html>
